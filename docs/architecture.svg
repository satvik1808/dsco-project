<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1085" viewBox="0 0 1620 1085" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .t  { font-size: 13.5px; font-weight: bold; fill: #222; }
      .b  { font-size: 12px; fill: #333; }
      .m  { font-size: 12px; fill: #333; font-family: Consolas, "Courier New", monospace; }
      .s  { font-size: 10.5px; fill: #666; }
      .ft { font-size: 15px; font-weight: bold; fill: #333; }
      .fs { font-size: 12px; fill: #666; font-style: italic; }
      .reg  { fill: #fff1e0; stroke: #d9822b; stroke-width: 1.6; }
      .comb { fill: #e8f0fe; stroke: #4a76c9; stroke-width: 1.4; }
      .fsm  { fill: #e7f6ec; stroke: #2f9e5a; stroke-width: 1.6; }
      .io   { fill: #f2f2f2; stroke: #888; stroke-width: 1.4; }
      .frame { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .sub   { fill: #fafafa; stroke: #777; stroke-width: 1.5; }
      .w  { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#a); }
      .w0 { fill: none; stroke: #555; stroke-width: 1.5; }
      .st { fill: #fff; stroke: #2f9e5a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1620" height="1085" fill="#ffffff"/>

  <!-- Title -->
  <text x="810" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Smart Elevator: how the whole design works</text>
  <text x="810" y="66" text-anchor="middle" class="fs">2 cars, 8 floors. Bit k of every 8-bit floor vector = floor k.</text>

  <!-- Inputs -->
  <rect x="80" y="95" width="340" height="55" rx="6" class="io"/>
  <text x="250" y="117" text-anchor="middle" class="t">Hall buttons (UP / DOWN at each floor)</text>
  <text x="250" y="136" text-anchor="middle" class="m">hall_up_btn[7:0], hall_dn_btn[7:0]</text>

  <text x="770" y="120" text-anchor="middle" class="fs">clk and rst go to every register</text>
  <text x="770" y="137" text-anchor="middle" class="fs">(everything updates on the rising clock edge)</text>

  <rect x="1125" y="95" width="250" height="55" rx="6" class="io"/>
  <text x="1250" y="117" text-anchor="middle" class="t">Cabin buttons, Car A</text>
  <text x="1250" y="136" text-anchor="middle" class="m">car_btn0[7:0]</text>

  <rect x="1395" y="95" width="160" height="55" rx="6" class="io"/>
  <text x="1475" y="117" text-anchor="middle" class="t">Cabin buttons, Car B</text>
  <text x="1475" y="136" text-anchor="middle" class="m">car_btn1[7:0]</text>

  <!-- Top-level frame -->
  <rect x="20" y="165" width="1580" height="820" rx="10" class="frame"/>
  <text x="38" y="188" class="ft">elevator_coordinator.v</text>
  <text x="222" y="188" class="fs">top level: no logic of its own, it only wires the three blocks together</text>

  <!-- ================= DISPATCHER ================= -->
  <rect x="50" y="205" width="550" height="760" rx="8" class="sub"/>
  <text x="70" y="230" class="ft">hall_call_dispatcher  u_dispatch</text>
  <text x="70" y="250" class="fs">decides which car answers each hall call</text>

  <!-- row 1: registers + split -->
  <rect x="75" y="275" width="260" height="100" rx="5" class="reg"/>
  <text x="88" y="294" class="t">Call registers (posedge clk)</text>
  <text x="88" y="312" class="b"><tspan class="m">pend</tspan>: call is waiting</text>
  <text x="88" y="328" class="b"><tspan class="m">asgd</tspan>: already handed to a car</text>
  <text x="88" y="344" class="b"><tspan class="m">owner</tspan>: 0 = Car A, 1 = Car B</text>
  <text x="88" y="362" class="s">UP and DOWN copies, 8 bits each</text>

  <rect x="365" y="275" width="215" height="100" rx="5" class="comb"/>
  <text x="378" y="294" class="t">Split by owner</text>
  <text x="378" y="316" class="m">asg0 = pend&amp;asgd&amp;~owner</text>
  <text x="378" y="334" class="m">asg1 = pend&amp;asgd&amp; owner</text>
  <text x="378" y="358" class="s">calls each car must serve</text>
  <path d="M335,325 L365,325" class="w"/>

  <!-- row 2: free -->
  <rect x="75" y="410" width="505" height="48" rx="5" class="comb"/>
  <text x="88" y="430" class="m">free = pend &amp; ~asgd</text>
  <text x="88" y="448" class="b">waiting calls not yet given to any car</text>
  <path d="M205,375 L205,410" class="w"/>

  <!-- row 3: priority encoders -->
  <rect x="75" y="495" width="240" height="60" rx="5" class="comb"/>
  <text x="88" y="517" class="t">priority_encoder8 enc_up</text>
  <text x="88" y="539" class="b">lowest free UP call → floor no.</text>
  <rect x="340" y="495" width="240" height="60" rx="5" class="comb"/>
  <text x="353" y="517" class="t">priority_encoder8 enc_dn</text>
  <text x="353" y="539" class="b">lowest free DOWN call → floor no.</text>
  <path d="M195,458 L195,495" class="w"/>
  <path d="M460,458 L460,495" class="w"/>

  <!-- row 4: mux -->
  <rect x="75" y="592" width="505" height="55" rx="5" class="comb"/>
  <text x="88" y="613" class="t">2-to-1 multiplexer (UP calls go first)</text>
  <text x="88" y="634" class="m">→ pick_floor, pick_up, pick_valid</text>
  <path d="M195,555 L195,592" class="w"/>
  <path d="M460,555 L460,592" class="w"/>

  <!-- row 5: decoder + distance -->
  <rect x="75" y="688" width="240" height="64" rx="5" class="comb"/>
  <text x="88" y="708" class="t">decoder3to8 dec_pick</text>
  <text x="88" y="726" class="m">pick_floor → pick_vec</text>
  <text x="88" y="743" class="s">one-hot; all 0s if pick_valid = 0</text>
  <rect x="340" y="688" width="240" height="64" rx="5" class="comb"/>
  <text x="353" y="708" class="t">distance d0, d1</text>
  <text x="353" y="726" class="m">|floor0 − pick_floor|</text>
  <text x="353" y="743" class="m">|floor1 − pick_floor|</text>
  <path d="M195,647 L195,688" class="w"/>
  <path d="M460,647 L460,688" class="w"/>

  <!-- row 6: new call + comparator -->
  <rect x="75" y="790" width="240" height="62" rx="5" class="comb"/>
  <text x="88" y="810" class="t">New assignment</text>
  <text x="88" y="828" class="m">new_up / new_dn = pick_vec</text>
  <text x="88" y="845" class="m">owner ← pick_car1</text>
  <rect x="340" y="790" width="240" height="62" rx="5" class="comb"/>
  <text x="353" y="810" class="t">Comparator</text>
  <text x="353" y="828" class="m">pick_car1 = dist1 &lt; dist0</text>
  <text x="353" y="845" class="b">nearer car wins, tie → Car A</text>
  <path d="M195,752 L195,790" class="w"/>
  <path d="M460,752 L460,790" class="w"/>
  <path d="M340,821 L315,821" class="w"/>

  <!-- row 7: next-state logic -->
  <rect x="75" y="885" width="505" height="66" rx="5" class="comb"/>
  <text x="88" y="903" class="t">Next register values (written on the next clock edge)</text>
  <text x="88" y="921" class="m">served = serve0 | serve1 ·  pend ← (pend | btn) &amp; ~served</text>
  <text x="88" y="939" class="m">asgd ← (asgd &amp; ~served) | new  ·  owner ← pick_car1 for new</text>
  <path d="M195,852 L195,885" class="w"/>
  <!-- loop back into registers -->
  <path d="M75,918 L62,918 L62,330 L75,330" class="w"/>

  <!-- hall buttons into registers -->
  <path d="M310,150 L310,275" class="w"/>

  <!-- ================= CAR A ================= -->
  <rect x="740" y="205" width="820" height="585" rx="8" class="sub"/>
  <text x="760" y="230" class="ft">elevator_car  u_car0  (Car A)</text>
  <text x="760" y="250" class="fs">one copy per car: a 4-state machine that follows the car's list of target floors</text>

  <!-- row 1 -->
  <rect x="765" y="275" width="295" height="75" rx="5" class="comb"/>
  <text x="778" y="295" class="t">targets</text>
  <text x="778" y="315" class="m">car_calls | up_asg | dn_asg</text>
  <text x="778" y="337" class="b">every floor this car has to visit</text>

  <rect x="1100" y="275" width="300" height="75" rx="5" class="reg"/>
  <text x="1113" y="295" class="t">car_calls register (8 flip-flops)</text>
  <text x="1113" y="315" class="b">set when a cabin button is pressed</text>
  <text x="1113" y="333" class="b">cleared when the door opens at that floor</text>
  <path d="M1100,312 L1060,312" class="w"/>
  <path d="M1250,150 L1250,275" class="w"/>

  <!-- dispatcher -> car A -->
  <path d="M580,312 L765,312" class="w"/>
  <text x="672" y="303" text-anchor="middle" class="m">up_asg0, dn_asg0</text>

  <!-- row 2 -->
  <rect x="765" y="385" width="295" height="65" rx="5" class="comb"/>
  <text x="778" y="406" class="t">decoder3to8 dec_here</text>
  <text x="778" y="426" class="m">floor → here (one-hot)</text>
  <text x="778" y="442" class="s">floor 3 → 00001000</text>

  <rect x="1100" y="385" width="300" height="65" rx="5" class="comb"/>
  <text x="1113" y="406" class="t">floor_masks</text>
  <text x="1113" y="426" class="m">floor → above, below</text>
  <text x="1113" y="442" class="s">floor 3 → above 11110000, below 00000111</text>

  <!-- floor feedback from FSM into decoder + masks -->
  <path d="M1540,650 L1550,650 L1550,370 L912,370 L912,385" class="w"/>
  <path d="M1250,370 L1250,385" class="w"/>
  <text x="1470" y="364" class="m">floor</text>

  <!-- row 3 -->
  <rect x="765" y="490" width="635" height="70" rx="5" class="comb"/>
  <text x="778" y="508" class="t">AND with targets, then OR all 8 bits together (reduction OR)</text>
  <text x="790" y="530" class="m" font-weight="bold">call_here</text>
  <text x="790" y="548" class="m">|(targets &amp; here)</text>
  <text x="1000" y="530" class="m" font-weight="bold">call_above</text>
  <text x="1000" y="548" class="m">|(targets &amp; above)</text>
  <text x="1210" y="530" class="m" font-weight="bold">call_below</text>
  <text x="1210" y="548" class="m">|(targets &amp; below)</text>
  <path d="M912,450 L912,490" class="w"/>
  <path d="M1250,450 L1250,490" class="w"/>
  <path d="M765,335 L752,335 L752,525 L765,525" class="w"/>

  <!-- row 4: next_dir, serve, FSM -->
  <rect x="765" y="600" width="235" height="70" rx="5" class="comb"/>
  <text x="778" y="620" class="t">next_dir logic</text>
  <text x="778" y="638" class="b">keep going while there is work</text>
  <text x="778" y="654" class="b">that way, else turn, else NONE</text>
  <path d="M880,560 L880,600" class="w"/>

  <rect x="765" y="700" width="235" height="75" rx="5" class="comb"/>
  <text x="778" y="720" class="t">serve_up / serve_dn</text>
  <text x="778" y="740" class="m">DOOR ? asg &amp; here : 0</text>
  <text x="778" y="760" class="b">tells dispatcher: call answered</text>

  <rect x="1030" y="600" width="510" height="175" rx="6" class="fsm"/>
  <text x="1045" y="620" class="t">State machine (posedge clk)</text>
  <text x="1045" y="638" class="b">registers: state, floor, dir, timer · 8 ticks per floor · door open 10 ticks</text>
  <path d="M1250,560 L1250,600" class="w"/>
  <path d="M1000,635 L1030,635" class="w"/>
  <path d="M1030,738 L1000,738" class="w"/>
  <text x="1015" y="731" text-anchor="middle" class="s">state</text>

  <!-- mini state diagram -->
  <rect x="1040" y="692" width="80" height="26" rx="13" class="st"/>
  <text x="1080" y="709" text-anchor="middle" class="m" font-weight="bold">IDLE</text>
  <rect x="1165" y="657" width="90" height="26" rx="13" class="st"/>
  <text x="1210" y="674" text-anchor="middle" class="m" font-weight="bold">MOVE_UP</text>
  <rect x="1165" y="727" width="90" height="26" rx="13" class="st"/>
  <text x="1210" y="744" text-anchor="middle" class="m" font-weight="bold">MOVE_DN</text>
  <rect x="1300" y="692" width="80" height="26" rx="13" class="st"/>
  <text x="1340" y="709" text-anchor="middle" class="m" font-weight="bold">DOOR</text>
  <path d="M1120,699 L1165,673" class="w"/>
  <path d="M1120,711 L1165,737" class="w"/>
  <path d="M1255,673 L1300,699" class="w"/>
  <path d="M1255,737 L1300,711" class="w"/>
  <path d="M1340,718 L1340,764 L1080,764 L1080,718" class="w"/>
  <text x="1125" y="676" class="s">above</text>
  <text x="1125" y="746" class="s">below</text>
  <text x="1262" y="680" class="s">here</text>
  <text x="1262" y="745" class="s">here</text>
  <text x="1392" y="700" class="s">door timer done →</text>
  <text x="1392" y="714" class="s">next_dir chooses</text>
  <text x="1392" y="728" class="s">MOVE_UP, MOVE_DN or IDLE</text>

  <!-- car A -> dispatcher: floor0 -->
  <path d="M1500,775 L1500,805 L700,805 L700,720 L580,720" class="w"/>
  <text x="1100" y="800" text-anchor="middle" class="m">floor0 (where Car A is)</text>
  <!-- car A -> dispatcher: serve0 -->
  <path d="M765,738 L640,738 L640,905 L580,905" class="w"/>
  <text x="646" y="860" class="m">serve0</text>

  <!-- ================= CAR B ================= -->
  <rect x="740" y="830" width="820" height="130" rx="8" class="sub"/>
  <text x="760" y="858" class="ft">elevator_car  u_car1  (Car B)</text>
  <text x="760" y="882" class="b">Identical copy of Car A: same decoder, floor masks, call logic and state machine.</text>
  <text x="760" y="902" class="b">Receives <tspan class="m">up_asg1, dn_asg1</tspan> · sends back <tspan class="m">floor1</tspan> (to distance d1)</text>
  <text x="760" y="920" class="b">and <tspan class="m">serve_up1, serve_dn1</tspan> (to <tspan class="m">served</tspan>).</text>
  <path d="M1555,122 L1585,122 L1585,895 L1560,895" class="w"/>
  <!-- bundle between dispatcher and car B -->
  <path d="M600,935 L740,935" class="w" marker-start="url(#a)"/>
  <text x="670" y="928" text-anchor="middle" class="s">asg1 →</text>
  <text x="670" y="952" text-anchor="middle" class="s">← floor1, serve1</text>

  <!-- ================= OUTPUTS ================= -->
  <path d="M600,985 L600,1005" class="w"/>
  <rect x="80" y="1005" width="1030" height="62" rx="6" class="io"/>
  <text x="95" y="1027" class="t">Outputs → testbench (tb/tb_elevator_coordinator.v) and web simulator (web/elevator_rtl.js)</text>
  <text x="95" y="1048" class="b">per car: floor, state, dir, timer, car_calls, door open  ·  hall lamps: up/dn pend, asgd, owner registers</text>

  <!-- legend -->
  <rect x="1150" y="1018" width="22" height="14" rx="3" class="reg"/>
  <text x="1178" y="1030" class="b">clocked register</text>
  <rect x="1290" y="1018" width="22" height="14" rx="3" class="comb"/>
  <text x="1318" y="1030" class="b">combinational logic</text>
  <rect x="1150" y="1042" width="22" height="14" rx="3" class="fsm"/>
  <text x="1178" y="1054" class="b">state machine</text>
  <rect x="1290" y="1042" width="22" height="14" rx="3" class="io"/>
  <text x="1318" y="1054" class="b">inputs / outputs</text>
</svg>
