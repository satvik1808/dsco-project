<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1190" viewBox="0 0 1620 1190" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .t  { font-size: 13.5px; font-weight: bold; fill: #222; }
      .b  { font-size: 12px; fill: #333; }
      .m  { font-size: 12px; fill: #333; font-family: Consolas, "Courier New", monospace; }
      .s  { font-size: 10.5px; fill: #666; }
      .ft { font-size: 15px; font-weight: bold; fill: #333; }
      .fs { font-size: 12px; fill: #666; font-style: italic; }
      .reg  { fill: #fff1e0; stroke: #d9822b; stroke-width: 1.6; }
      .comb { fill: #e8f0fe; stroke: #4a76c9; stroke-width: 1.4; }
      .fsm  { fill: #e7f6ec; stroke: #2f9e5a; stroke-width: 1.6; }
      .io   { fill: #f2f2f2; stroke: #888; stroke-width: 1.4; }
      .gl   { fill: #fffbe6; stroke: #c9b458; stroke-width: 1.4; }
      .frame { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .sub   { fill: #fafafa; stroke: #777; stroke-width: 1.5; }
      .w  { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#a); }
      .st { fill: #fff; stroke: #2f9e5a; stroke-width: 1.4; }
      .sn { font-size: 11px; font-weight: bold; fill: #1d6b3d; }
    </style>
  </defs>

  <rect width="1620" height="1190" fill="#ffffff"/>

  <!-- Title -->
  <text x="810" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Smart Elevator: how the whole design works</text>
  <text x="810" y="66" text-anchor="middle" class="fs">2 cars, 8 floors. Every 8-bit "floor vector" has one bit per floor: bit k stands for floor k.</text>

  <!-- Inputs -->
  <rect x="80" y="92" width="340" height="62" rx="6" class="io"/>
  <text x="250" y="113" text-anchor="middle" class="t">Hall buttons (UP / DOWN at each floor)</text>
  <text x="250" y="131" text-anchor="middle" class="b">8 UP buttons + 8 DOWN buttons, one bit per floor</text>
  <text x="250" y="146" text-anchor="middle" class="s">code: hall_up_btn, hall_dn_btn</text>

  <text x="770" y="118" text-anchor="middle" class="fs">The clock and reset signals go to every register</text>
  <text x="770" y="135" text-anchor="middle" class="fs">(everything updates on the rising edge of the clock)</text>

  <rect x="1125" y="92" width="250" height="62" rx="6" class="io"/>
  <text x="1250" y="113" text-anchor="middle" class="t">Cabin buttons, Car A</text>
  <text x="1250" y="131" text-anchor="middle" class="b">8 floor buttons inside the car</text>
  <text x="1250" y="146" text-anchor="middle" class="s">code: car_btn0</text>

  <rect x="1395" y="92" width="160" height="62" rx="6" class="io"/>
  <text x="1475" y="113" text-anchor="middle" class="t">Cabin buttons, Car B</text>
  <text x="1475" y="131" text-anchor="middle" class="b">8 floor buttons</text>
  <text x="1475" y="146" text-anchor="middle" class="s">code: car_btn1</text>

  <!-- Top-level frame -->
  <rect x="20" y="165" width="1580" height="835" rx="10" class="frame"/>
  <text x="38" y="188" class="ft">Top level (elevator_coordinator.v)</text>
  <text x="345" y="188" class="fs">has no logic of its own: it only wires the dispatcher and the two cars together</text>

  <!-- ================= DISPATCHER ================= -->
  <rect x="50" y="205" width="550" height="780" rx="8" class="sub"/>
  <text x="70" y="230" class="ft">Hall call dispatcher</text><text x="70" y="266" class="s">hall_call_dispatcher.v</text>
  <text x="70" y="250" class="fs">picks which car answers each call</text>

  <!-- row 1: registers + split -->
  <rect x="75" y="275" width="260" height="100" rx="5" class="reg"/>
  <text x="88" y="294" class="t">Call registers (clocked)</text>
  <text x="88" y="312" class="b"><tspan font-weight="bold">pending</tspan>: a call is waiting</text>
  <text x="88" y="328" class="b"><tspan font-weight="bold">assigned</tspan>: already given to a car</text>
  <text x="88" y="344" class="b"><tspan font-weight="bold">owner</tspan>: 0 = Car A, 1 = Car B</text>
  <text x="88" y="362" class="s">separate UP and DOWN sets, 8 bits each</text>

  <rect x="365" y="275" width="215" height="100" rx="5" class="comb"/>
  <text x="378" y="294" class="t">Split calls by owner</text>
  <text x="378" y="313" class="b">Car A: pending AND assigned</text>
  <text x="420" y="328" class="b">AND owner is 0</text>
  <text x="378" y="346" class="b">Car B: pending AND assigned</text>
  <text x="420" y="361" class="b">AND owner is 1</text>
  <path d="M335,325 L365,325" class="w"/>

  <!-- row 2: free -->
  <rect x="75" y="410" width="505" height="48" rx="5" class="comb"/>
  <text x="88" y="430" class="b"><tspan font-weight="bold">free calls</tspan> = pending AND NOT assigned</text>
  <text x="88" y="448" class="b">calls that are waiting but not yet given to any car</text>
  <path d="M205,375 L205,410" class="w"/>

  <!-- row 3: priority encoders -->
  <rect x="75" y="495" width="240" height="60" rx="5" class="comb"/>
  <text x="88" y="517" class="t">Priority encoder (UP calls)</text>
  <text x="88" y="539" class="b">lowest floor with a free UP call</text>
  <rect x="340" y="495" width="240" height="60" rx="5" class="comb"/>
  <text x="353" y="517" class="t">Priority encoder (DOWN calls)</text>
  <text x="353" y="539" class="b">lowest floor with a free DOWN call</text>
  <path d="M195,458 L195,495" class="w"/>
  <path d="M460,458 L460,495" class="w"/>

  <!-- row 4: mux -->
  <rect x="75" y="592" width="505" height="55" rx="5" class="comb"/>
  <text x="88" y="613" class="t">2-to-1 multiplexer (UP calls go first)</text>
  <text x="88" y="634" class="b">gives: the chosen floor · is it an UP or DOWN call · is there any call at all</text>
  <path d="M195,555 L195,592" class="w"/>
  <path d="M460,555 L460,592" class="w"/>

  <!-- row 5: decoder + distance -->
  <rect x="75" y="688" width="240" height="64" rx="5" class="comb"/>
  <text x="88" y="708" class="t">3-to-8 decoder</text>
  <text x="88" y="726" class="b">chosen floor number → one-hot</text>
  <text x="88" y="743" class="b">floor vector (all zeros if no call)</text>
  <rect x="340" y="688" width="240" height="64" rx="5" class="comb"/>
  <text x="353" y="708" class="t">Distance calculators</text>
  <text x="353" y="726" class="b">Car A: |Car A floor − chosen floor|</text>
  <text x="353" y="743" class="b">Car B: |Car B floor − chosen floor|</text>
  <path d="M195,647 L195,688" class="w"/>
  <path d="M460,647 L460,688" class="w"/>

  <!-- row 6: new call + comparator -->
  <rect x="75" y="790" width="240" height="62" rx="5" class="comb"/>
  <text x="88" y="810" class="t">New assignment</text>
  <text x="88" y="828" class="b">mark the chosen floor as assigned</text>
  <text x="88" y="845" class="b">owner = the nearer car</text>
  <rect x="340" y="790" width="240" height="62" rx="5" class="comb"/>
  <text x="353" y="810" class="t">Comparator</text>
  <text x="353" y="828" class="b">Car B distance &lt; Car A distance ?</text>
  <text x="353" y="845" class="b">yes → Car B, no or tie → Car A</text>
  <path d="M195,752 L195,790" class="w"/>
  <path d="M460,752 L460,790" class="w"/>
  <path d="M340,821 L315,821" class="w"/>

  <!-- row 7: next-state logic -->
  <rect x="75" y="882" width="505" height="92" rx="5" class="comb"/>
  <text x="88" y="900" class="t">Next register values (stored on the next clock edge)</text>
  <text x="88" y="918" class="b"><tspan font-weight="bold">answered</tspan> = answered by Car A OR answered by Car B</text>
  <text x="88" y="934" class="b"><tspan font-weight="bold">pending</tspan> ← (pending OR new button press) AND NOT answered</text>
  <text x="88" y="950" class="b"><tspan font-weight="bold">assigned</tspan> ← (assigned AND NOT answered) OR new assignment</text>
  <text x="88" y="966" class="b"><tspan font-weight="bold">owner</tspan> ← the nearer car, for the new assignment</text>
  <path d="M195,852 L195,882" class="w"/>
  <!-- loop back into registers -->
  <path d="M75,918 L62,918 L62,330 L75,330" class="w"/>

  <!-- hall buttons into registers -->
  <path d="M322,154 L322,275" class="w"/>

  <!-- ================= CAR A ================= -->
  <rect x="740" y="205" width="820" height="585" rx="8" class="sub"/>
  <text x="760" y="230" class="ft">Elevator car A</text>
  <text x="760" y="250" class="fs">one copy per car (elevator_car.v): a 4-state machine that visits the car's list of target floors</text>

  <!-- row 1 -->
  <rect x="765" y="275" width="295" height="75" rx="5" class="comb"/>
  <text x="778" y="295" class="t">Target floors</text>
  <text x="778" y="315" class="b">cabin calls OR hall UP calls OR hall</text>
  <text x="778" y="333" class="b">DOWN calls given to this car</text>

  <rect x="1100" y="275" width="300" height="75" rx="5" class="reg"/>
  <text x="1113" y="295" class="t">Cabin call register (8 flip-flops)</text>
  <text x="1113" y="315" class="b">set when a cabin button is pressed</text>
  <text x="1113" y="333" class="b">cleared when the door opens at that floor</text>
  <path d="M1100,312 L1060,312" class="w"/>
  <path d="M1250,154 L1250,275" class="w"/>

  <!-- dispatcher -> car A -->
  <path d="M580,312 L765,312" class="w"/>
  <text x="672" y="303" text-anchor="middle" class="b">hall calls for Car A</text>

  <!-- row 2 -->
  <rect x="765" y="385" width="295" height="65" rx="5" class="comb"/>
  <text x="778" y="406" class="t">3-to-8 decoder</text>
  <text x="778" y="424" class="b">current floor → one-hot "here" vector</text>
  <text x="778" y="442" class="s">floor 3 → 00001000</text>

  <rect x="1100" y="385" width="300" height="65" rx="5" class="comb"/>
  <text x="1113" y="406" class="t">Floor masks</text>
  <text x="1113" y="424" class="b">current floor → floors above / floors below</text>
  <text x="1113" y="442" class="s">floor 3 → above 11110000, below 00000111</text>

  <!-- floor feedback from FSM into decoder + masks -->
  <path d="M1540,650 L1550,650 L1550,370 L912,370 L912,385" class="w"/>
  <path d="M1250,370 L1250,385" class="w"/>
  <text x="1453" y="364" class="b">current floor</text>

  <!-- row 3 -->
  <rect x="765" y="490" width="635" height="70" rx="5" class="comb"/>
  <text x="778" y="508" class="t">AND each with the target floors, then OR all 8 bits: is any bit 1?</text>
  <text x="790" y="530" class="b" font-weight="bold">Call at this floor?</text>
  <text x="790" y="548" class="b">targets AND here</text>
  <text x="1000" y="530" class="b" font-weight="bold">Call above?</text>
  <text x="1000" y="548" class="b">targets AND above</text>
  <text x="1210" y="530" class="b" font-weight="bold">Call below?</text>
  <text x="1210" y="548" class="b">targets AND below</text>
  <path d="M912,450 L912,490" class="w"/>
  <path d="M1250,450 L1250,490" class="w"/>
  <path d="M765,335 L752,335 L752,525 L765,525" class="w"/>

  <!-- row 4: next_dir, serve, FSM -->
  <rect x="765" y="600" width="235" height="70" rx="5" class="comb"/>
  <text x="778" y="620" class="t">Next direction logic</text>
  <text x="778" y="638" class="b">keep going while there is work</text>
  <text x="778" y="654" class="b">that way, else turn, else stop</text>
  <path d="M880,560 L880,600" class="w"/>

  <rect x="765" y="698" width="235" height="78" rx="5" class="comb"/>
  <text x="778" y="716" class="t">Calls answered</text>
  <text x="778" y="734" class="b">if the door is open: this car's</text>
  <text x="778" y="750" class="b">hall calls AND here</text>
  <text x="778" y="766" class="b">→ tells the dispatcher</text>

  <rect x="1030" y="600" width="510" height="175" rx="6" class="fsm"/>
  <text x="1045" y="620" class="t">State machine (clocked)</text>
  <text x="1045" y="638" font-size="11" fill="#333">stores: state, floor, direction, timer · 1 floor = 8 clock ticks · door open = 10 ticks</text>
  <path d="M1250,560 L1250,600" class="w"/>
  <path d="M1000,635 L1030,635" class="w"/>
  <path d="M1030,738 L1000,738" class="w"/>
  <text x="1015" y="731" text-anchor="middle" class="s">state</text>

  <!-- mini state diagram -->
  <rect x="1040" y="692" width="70" height="26" rx="13" class="st"/>
  <text x="1075" y="709" text-anchor="middle" class="sn">IDLE</text>
  <rect x="1150" y="657" width="105" height="26" rx="13" class="st"/>
  <text x="1202" y="674" text-anchor="middle" class="sn">MOVING UP</text>
  <rect x="1150" y="727" width="105" height="26" rx="13" class="st"/>
  <text x="1202" y="744" text-anchor="middle" class="sn">MOVING DOWN</text>
  <rect x="1295" y="692" width="90" height="26" rx="13" class="st"/>
  <text x="1340" y="709" text-anchor="middle" class="sn">DOOR OPEN</text>
  <path d="M1110,699 L1150,673" class="w"/>
  <path d="M1110,711 L1150,737" class="w"/>
  <path d="M1255,673 L1295,699" class="w"/>
  <path d="M1255,737 L1295,711" class="w"/>
  <path d="M1340,718 L1340,764 L1075,764 L1075,718" class="w"/>
  <text x="1108" y="676" class="s">above</text>
  <text x="1108" y="748" class="s">below</text>
  <text x="1262" y="680" class="s">here</text>
  <text x="1262" y="745" class="s">here</text>
  <text x="1395" y="700" class="s">when the door timer ends,</text>
  <text x="1395" y="714" class="s">the next direction picks</text>
  <text x="1395" y="728" class="s">UP, DOWN or IDLE</text>

  <!-- car A -> dispatcher: floor -->
  <path d="M1500,775 L1500,805 L700,805 L700,720 L580,720" class="w"/>
  <text x="1100" y="800" text-anchor="middle" class="b">Car A's current floor</text>
  <!-- car A -> dispatcher: answered -->
  <path d="M765,738 L640,738 L640,905 L580,905" class="w"/>
  <text x="646" y="850" class="b">Car A</text>
  <text x="646" y="865" class="b">answered</text>

  <!-- ================= CAR B ================= -->
  <rect x="740" y="830" width="820" height="155" rx="8" class="sub"/>
  <text x="760" y="858" class="ft">Elevator car B</text>
  <text x="760" y="882" class="b">Identical copy of Car A: same decoder, floor masks, call logic and state machine.</text>
  <text x="760" y="902" class="b">Receives the hall calls given to Car B · sends back its current floor (to the distance calculators)</text>
  <text x="760" y="920" class="b">and which hall calls it answered (to the next-register-values logic).</text>
  <path d="M1555,122 L1585,122 L1585,895 L1560,895" class="w"/>
  <!-- bundle between dispatcher and car B -->
  <path d="M600,940 L740,940" class="w" marker-start="url(#a)"/>
  <text x="670" y="933" text-anchor="middle" class="s">Car B's calls →</text>
  <text x="670" y="957" text-anchor="middle" class="s">← floor, answered</text>

  <!-- ================= OUTPUTS ================= -->
  <path d="M600,1000 L600,1018" class="w"/>
  <rect x="80" y="1018" width="1030" height="62" rx="6" class="io"/>
  <text x="95" y="1040" class="t">Outputs → testbench (tb/tb_elevator_coordinator.v) and web simulator (web/elevator_rtl.js)</text>
  <text x="95" y="1061" class="b">for each car: floor, state, direction, timer, cabin calls, door open · hall lamps: pending, assigned, owner registers</text>

  <!-- legend -->
  <rect x="1150" y="1031" width="22" height="14" rx="3" class="reg"/>
  <text x="1178" y="1043" class="b">clocked register</text>
  <rect x="1290" y="1031" width="22" height="14" rx="3" class="comb"/>
  <text x="1318" y="1043" class="b">combinational logic</text>
  <rect x="1150" y="1055" width="22" height="14" rx="3" class="fsm"/>
  <text x="1178" y="1067" class="b">state machine</text>
  <rect x="1290" y="1055" width="22" height="14" rx="3" class="io"/>
  <text x="1318" y="1067" class="b">inputs / outputs</text>

  <!-- ================= GLOSSARY ================= -->
  <rect x="20" y="1095" width="1580" height="82" rx="6" class="gl"/>
  <text x="38" y="1116" class="t">Short names you will see in the Verilog code</text>
  <text x="38" y="1137" class="b"><tspan class="m">pend</tspan> = pending · <tspan class="m">asgd</tspan> = assigned · <tspan class="m">asg</tspan> = assigned calls · <tspan class="m">up / dn</tspan> = up / down · <tspan class="m">btn</tspan> = button · <tspan class="m">dir</tspan> = direction · <tspan class="m">dist</tspan> = distance · <tspan class="m">serve</tspan> = calls answered · <tspan class="m">targets</tspan> = target floors · <tspan class="m">here</tspan> = current floor as a one-hot vector</text>
  <text x="38" y="1155" class="b"><tspan class="m">enc</tspan> = encoder · <tspan class="m">dec</tspan> = decoder · <tspan class="m">d0 / d1</tspan> = distance for car 0 / car 1 · <tspan class="m">0 / 1</tspan> at the end of a name = Car A / Car B · <tspan class="m">u_</tspan> = instance (one placed copy of a module) · <tspan class="m">clk</tspan> = clock · <tspan class="m">rst</tspan> = reset</text>
  <text x="38" y="1172" class="b"><tspan class="m">posedge</tspan> = rising (positive) clock edge · <tspan class="m">FSM</tspan> = finite state machine · states in code: <tspan class="m">IDLE</tspan>, <tspan class="m">MOVE_UP</tspan> = moving up, <tspan class="m">MOVE_DN</tspan> = moving down, <tspan class="m">DOOR</tspan> = door open · <tspan class="m">reg</tspan> = register · <tspan class="m">FF</tspan> = flip-flop</text>
</svg>
